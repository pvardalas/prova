<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Prova Owner</title>
<style>
:root{--bg:#f6f5f2;--ink:#1d1d1b;--mut:#6d6b66;--line:#e3e1db;--card:#fff;--green:#1f9d55;--red:#d64541;--acc:#2458c6;--warn:#a86500;--warnbg:#fff1d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.att{border-top:1px solid var(--line);padding:9px 0}.att:first-child{border-top:0}
.att b{display:block}.att .by{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:#eee;color:var(--mut)}
.chip.ok{background:#e3f4ea;color:#14663a}.chip.bad{background:#fbe7e7;color:#a52b28}.chip.warn{background:var(--warnbg);color:var(--warn)}
.go{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:700;background:var(--green);color:#fff;cursor:pointer;margin-top:12px}
.go:disabled{opacity:.45}
button.sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:14px;cursor:pointer}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}.msg.ok{background:#e3f4ea;color:#14663a}.msg.bad{background:#fbe7e7;color:#a52b28}.msg.note{background:var(--warnbg);color:#6b4300}
.empty{color:var(--mut);font-size:14px}
.ho{display:flex;gap:10px;align-items:flex-start}.ho .t{flex:1}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}.live.on{background:var(--green)}
.rule{position:relative;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:8px 11px;background:#fff;margin:6px 0;cursor:help;outline:none}
.rule:hover,.rule:focus{background:#e8effc;border-color:var(--acc)}
.rule .rt{font-weight:600;font-size:15px}.rule .rs{font-size:12px;color:var(--mut)}
.rule .rq{display:none;margin-top:6px;padding:7px 9px;background:#1d1d1b;color:#fff;border-radius:8px;font-size:13px;font-style:italic;word-break:break-word}
.rule .rq b{font-style:normal;color:#9db8f0;display:block;font-size:11px}
.rule:hover .rq,.rule:focus .rq{display:block}
.fid{font-size:13.5px;margin:4px 0 8px}
nav{font-size:13px;margin-top:6px}nav a{color:var(--acc);margin-right:12px}
</style>
</head>
<body>
<main>
  <div class="sub"><span class="live" id="live"></span><span id="conn">connecting</span></div>
  <h1 id="co">Prova</h1>
  <div class="sub" id="state"></div>
  <div id="msg"></div>

  <h2>Turn on</h2>
  <div id="turnon"><div class="empty">Nothing waiting for you.</div></div>
  <div id="extras"></div>

  <h2>Rules I understood</h2>
  <div id="rules"><div class="empty">Loading ...</div></div>

  <h2>Handoffs (clients who asked for a person)</h2>
  <div id="handoffs"><div class="empty">None.</div></div>

  <nav><a href="/">Dashboard</a><a href="/ui/playbook.html">Playbook</a><a href="/ui/lab.html">Sandbox</a><a href="/ui/index.html#s7">Live calls</a><a href="http://127.0.0.1:8799/ui/index.html#s7" target="_blank" rel="noopener" title="Finished showcase run: calls, rehearsals, results">Demo</a></nav>
</main>
<script>
"use strict";
/* Owner page. Opened once from a QR; the owner token may arrive as ?t=<token> and is then sent as Bearer.
 * GET  /api/owner -> {company, status, certified?, pending_turn_on: {token, url?, attestations:[{fact, text|value, by, quote?}], certification?, gaps?}, handoffs?:[{id, customer_name, reason, status, context?}]}
 * POST /api/owner/turn_on {token}  (the one human tap)     [request to Builder U phase 3 / A: turn_on(token)]
 * POST /api/handoffs/{id}/resolve  {note?}
 * Live updates: GET /api/events/stream (handoff, setup, policy, consent, confirmation events) with polling fallback. */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pj = v => { if (typeof v === "string") { try { return JSON.parse(v); } catch (e) { return v; } } return v; };
const arr = v => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
const OT = new URLSearchParams(location.search).get("t") || "";
const TAP = location.pathname.startsWith("/t/");   // the owner's link /t/{token}: the token in the URL is the credential, no other API is used
async function api(method, path, body) {
  const h = {}; if (body !== undefined) h["Content-Type"] = "application/json"; if (OT) h.Authorization = "Bearer " + OT;
  try {
    const r = await fetch(path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });
    const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = null; }
    if (r.status === 404 || r.status === 405) return { ok: false, unwired: true, error: "Not wired yet: " + method + " " + path.split("?")[0] };
    if (!r.ok || (d && d.error)) return { ok: false, error: (d && (d.error || (typeof d.detail === "string" ? d.detail : d.detail && d.detail.error))) || r.status };
    return { ok: true, data: d };
  } catch (e) { return { ok: false, error: "Network error" }; }
}
let O = null, lastId = 0;
function msg(t, c) { $("#msg").innerHTML = t ? `<div class="msg ${c || "bad"}">${esc(t)}</div>` : ""; }
async function load() {
  const r = TAP ? await api("GET", location.pathname) : await api("GET", "/api/owner");
  if (!r.ok) { if (r.unwired) msg(r.error, "note"); else msg(String(r.error)); }
  else O = r.data || {};
  render(O && O.handoffs || []);
  loadRules();
}
/* key rules come from GET /api/setup2/case (read-only); hover or tap a rule to see the sentence it came from */
async function loadRules() {
  const el = $("#rules");
  if (TAP) { el.innerHTML = '<div class="empty">Open the owner page to see the rules.</div>'; return; }
  const r = await api("GET", "/api/setup2/case");
  if (!r.ok || !r.data) { el.innerHTML = '<div class="empty">Rules not available yet.</div>'; return; }
  const c = r.data, rules = arr(c.key_rules), f = c.fidelity, cert = c.certification || (O && O.certification);
  if (!rules.length) { el.innerHTML = '<div class="empty">No rules yet. They appear once the documents are read.</div>'; return; }
  let h = "";
  if (f) h += `<div class="fid"><span class="chip ${f.ok != null && f.ok < f.total ? "warn" : "ok"}">fidelity</span> ${esc(f.line || (f.ok + "/" + f.total))}</div>`;
  h += rules.map(x => `<div class="rule" tabindex="0" title="${esc(x.quote || "")}"><div class="rt">${esc(x.text)}</div><div class="rs">${esc(x.doc || "")}${x.doc && x.slot ? " · " : ""}${esc(x.slot || "")}</div>${x.quote ? `<div class="rq"><b>${esc(x.doc || "source")}</b>“${esc(x.quote)}”</div>` : ""}</div>`).join("");
  el.innerHTML = h;
}
function render(hos) {
  O = O || {};
  $("#co").textContent = O.company || "Prova";
  $("#state").textContent = O.status ? "Status: " + O.status : "";
  const p = O.pending_turn_on || O.pending || null;
  const el = $("#turnon");
  if (O.status === "live" && !p) el.innerHTML = '<div class="card"><span class="chip ok">live</span> Calling is on.</div>';
  else if (!p || (!p.token && !p.attestations)) el.innerHTML = '<div class="empty">Nothing waiting for you.</div>';
  else {
    const atts = arr(p.attestations);
    const cert = p.certification || O.certification;
    let h = `<div class="card"><div class="sub">Please check what was attested on your behalf before you turn on.</div>`;
    h += atts.length ? atts.map(a => `<div class="att"><b>${esc(typeof a === "object" ? (a.text || a.fact || a.key || JSON.stringify(a.value)) : a)}</b>
      <div class="by">${a.by ? "by " + esc(typeof a.by === "object" ? (a.by.name || a.by.role) : a.by) : ""}${a.value != null ? " · " + esc(typeof a.value === "object" ? JSON.stringify(a.value) : a.value) : ""}</div>
      ${a.quote ? `<div class="by">“${esc(a.quote)}”</div>` : ""}</div>`).join("") : '<div class="empty">No attestations listed.</div>';
    if (cert) h += `<div class="att"><b>Certification</b><div class="by">${esc(typeof cert === "string" ? cert : Object.entries(cert).filter(([k]) => ["attacks", "generated", "setup_attacks", "mutants", "checks", "guard_false_block_rate"].includes(k)).map(([k, v]) => k.replace(/_/g, " ") + " " + (v && typeof v === "object" ? (v.passed ?? v.caught ?? "") + "/" + (v.total ?? v.n ?? "") : v)).join(" · "))}</div></div>`;
    const gaps = arr(p.gaps);
    if (gaps.length) h += `<div class="msg note">Still open: ${esc(gaps.map(g => g.text || g.fact || g).join("; "))}</div>`;
    h += `<button class="go" id="go" ${gaps.length ? "disabled" : ""}>Turn on</button></div>`;
    el.innerHTML = h;
    $("#go").onclick = async () => {
      $("#go").disabled = true;
      const r = TAP ? await api("POST", location.pathname, {}) : await api("POST", "/api/owner/turn_on", { token: p.token });
      if (r.ok) { msg("Prova is live.", "ok"); O.status = "live"; O.pending_turn_on = null; load(); } else { msg(r.error); $("#go").disabled = false; }
    };
  }
  const ex = $("#extras"); ex.innerHTML = "";
  if (O.paused && !TAP) ex.innerHTML += '<div class="msg bad">The setup session is paused after repeated or forbidden actions by an agent. <button class="sm" id="resume">Resume</button></div>';
  const cf = arr(O.confirmations);
  if (cf.length && !TAP) ex.innerHTML += '<h2>Waiting for your confirmation (asked by an agent)</h2>' + cf.map(x => `<div class="card ho"><div class="t"><b>${esc(x.action)}</b><div class="sub">${esc(JSON.stringify(x.args))} · by ${esc(x.by)}</div></div><button class="sm" data-cf="${esc(x.token)}">Confirm</button></div>`).join("");
  const list = arr(hos).filter(x => x && (x.status || "waiting") === "waiting");
  $("#handoffs").innerHTML = list.length ? list.map(x => `<div class="card ho"><div class="t"><b>${esc(x.customer_name || x.name || "Client " + (x.customer_id || ""))}</b>
    <div class="sub">${esc(x.reason || "")}</div>${x.context ? `<div class="sub">${esc(typeof x.context === "string" ? x.context.slice(0, 220) : JSON.stringify(x.context).slice(0, 220))}</div>` : ""}</div>
    <button class="sm" data-r="${esc(x.id)}">Done</button></div>`).join("") : '<div class="empty">None.</div>';
}
$("#extras").addEventListener("click", async e => {
  if (e.target.id === "resume") { const r = await api("POST", "/api/setup2/resume", {}); msg(r.ok ? "Resumed." : r.error, r.ok ? "ok" : "bad"); return load(); }
  const b = e.target.closest("button[data-cf]"); if (!b) return;
  const r = await api("POST", "/api/confirm/" + encodeURIComponent(b.dataset.cf), {});
  msg(r.ok ? "Done." : r.error, r.ok ? "ok" : "bad"); load();
});
$("#handoffs").addEventListener("click", async e => {
  const b = e.target.closest("button[data-r]"); if (!b) return;
  const r = await api("POST", "/api/handoffs/" + encodeURIComponent(b.dataset.r) + "/resolve", {});
  if (!r.ok) msg(r.error); load();
});
let tm; function later() { clearTimeout(tm); tm = setTimeout(load, 400); }
let es, fails = 0, poll;
function stream() {
  es = new EventSource("/api/events/stream");
  es.onopen = () => { fails = 0; $("#conn").textContent = "live"; $("#live").classList.add("on"); if (poll) { clearInterval(poll); poll = null; } };
  const on = m => { try { const ev = JSON.parse(m.data); if (ev.id <= lastId) return; lastId = ev.id; if (["handoff", "setup", "policy", "consent", "confirmation", "question"].includes(ev.type)) later(); } catch (e) {} };
  es.onmessage = on; es.addEventListener("event", on);
  es.onerror = () => { fails++; $("#conn").textContent = "reconnecting"; $("#live").classList.remove("on"); if (fails >= 2) { try { es.close(); } catch (e) {} if (!poll) poll = setInterval(load, 3000); } };
}
load(); stream();
</script>
</body>
</html>
