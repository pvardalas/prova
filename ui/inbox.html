<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Prova Inbox</title>
<style>
:root{--bg:#f6f5f2;--ink:#1d1d1b;--mut:#6d6b66;--line:#e3e1db;--card:#fff;--green:#1f9d55;--acc:#2458c6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mut);cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h1{font-size:22px;margin:10px 0 2px}.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.card.new{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,88,198,.1)}
.card h3{margin:0 0 4px;font-size:16px}.card .t{color:var(--mut);font-size:12px;margin-top:6px}
.btn{display:inline-block;margin-top:10px;background:var(--green);color:#fff;text-decoration:none;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:#eee;color:var(--mut)}
.chip.ok{background:#e3f4ea;color:#14663a}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px;background:#fff1d6;color:#6b4300}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
  <div class="bar"><span id="conn"></span><span><button data-l="el">EL</button> <button data-l="en">EN</button></span></div>
  <h1 id="co">Prova</h1>
  <div class="sub" id="who"></div>
  <div id="msg"></div>
  <div id="list"></div>
</main>
<script>
"use strict";
/* Per-customer inbox at /inbox/{token}. Data: GET /api/inbox/{token} ->
 *   {company, customer_name?, items:[{id, kind: "consent_request"|"confirmation"|"message", title?, text?, url?, status?, at?}]}
 * consent_request links to /k/{token}; confirmation links to /c/{token}. Polls every 4 s (public page, no SSE). */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang = "el"; try { lang = localStorage.getItem("prova_lang") || "el"; } catch (e) {}
const token = location.pathname.split("/").filter(Boolean).pop() || "";
const T = {
  el: { hi: n => n ? "Γεια σας, " + n : "Τα μηνύματά σας", empty: "Δεν υπάρχουν μηνύματα ακόμα. Η σελίδα ανανεώνεται μόνη της.", consent: "Αίτημα συναίνεσης", conf: "Επιβεβαίωση ανανέωσης",
        open: "Άνοιγμα", confirm: "Επιβεβαίωση", nowired: "Δεν είναι συνδεδεμένο ακόμα.", bad: "Ο σύνδεσμος δεν ισχύει.", live: "ζωντανά", consentText: "Θα θέλαμε την άδειά σας για να σας καλέσει ο ψηφιακός βοηθός μας.", confText: "Η ανανέωσή σας περιμένει επιβεβαίωση. Πατήστε για να την ολοκληρώσετε." },
  en: { hi: n => n ? "Hello, " + n : "Your messages", empty: "No messages yet. This page updates by itself.", consent: "Consent request", conf: "Renewal confirmation",
        open: "Open", confirm: "Confirm", nowired: "Not wired yet.", bad: "This link is not valid.", live: "live", consentText: "We would like your permission for our digital assistant to call you.", confText: "Your renewal is waiting for your confirmation. Tap to complete it." },
};
const t = k => T[lang][k];
document.querySelectorAll(".bar button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("prova_lang", lang); } catch (e) {} render(); });
let D = null, seen = new Set(), first = true;
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll(".bar button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  if (!D) return;
  $("#co").textContent = D.company || "Prova";
  $("#who").textContent = t("hi")(D.customer_name);
  const items = Array.isArray(D.items) ? D.items : [];
  $("#list").innerHTML = items.length ? items.map(i => {
    const kind = i.kind || i.type, url = i.url || (kind === "consent_request" ? "/k/" + (i.token || token) : kind === "confirmation" ? "/c/" + (i.token || "") : "");
    const title = i.title || (kind === "consent_request" ? t("consent") : kind === "confirmation" ? t("conf") : "");
    const text = i.text || (kind === "consent_request" ? t("consentText") : kind === "confirmation" ? t("confText") : "");
    const isNew = !first && !seen.has(i.id);
    const done = i.status && !["sent", "pending", "new"].includes(i.status);
    return `<div class="card ${isNew ? "new" : ""}"><h3>${esc(title)} ${done ? `<span class="chip ok">${esc(i.status)}</span>` : ""}</h3><div>${esc(text)}</div>
      ${url && !done ? `<a class="btn ${kind === "confirmation" ? "" : "alt"}" href="${esc(url)}">${kind === "confirmation" ? t("confirm") : t("open")}</a>` : ""}
      ${i.at ? `<div class="t">${esc(i.at)}</div>` : ""}</div>`;
  }).join("") : `<div class="empty">${t("empty")}</div>`;
  items.forEach(i => seen.add(i.id)); first = false;
}
async function load() {
  try {
    const r = await fetch("/api/inbox/" + encodeURIComponent(token), { headers: { Accept: "application/json" } });
    if (r.status === 404 || r.status === 405) { $("#msg").innerHTML = `<div class="msg">${t("nowired")}</div>`; return; }
    if (!r.ok) { $("#msg").innerHTML = `<div class="msg">${t("bad")}</div>`; return; }
    $("#msg").innerHTML = ""; D = await r.json(); $("#conn").textContent = t("live"); render();
  } catch (e) { $("#conn").textContent = "..."; }
}
render(); load(); setInterval(load, 4000);
</script>
</body>
</html>
