<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e1e4ea; --line2:#eef0f4; --text:#1c2230; --mute:#677086;
  --acc:#2458c6; --acc-bg:#e8effc; --ok:#1c8a4e; --ok-bg:#e3f4ea; --bad:#c62f2f; --bad-bg:#fbe7e7;
  --warn:#a86500; --warn-bg:#fff1d6; --grey:#9aa2b2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);height:48px}
header .brand{font-weight:700;letter-spacing:.3px;color:var(--acc);font-size:16px}
header .co{font-weight:600}
header .topnav{display:flex;gap:2px}
header .topnav a{padding:4px 10px;border-radius:6px;color:var(--mute);text-decoration:none;font-weight:600}
header .topnav a:hover{background:var(--line2)}
header .topnav a.cur{background:var(--acc-bg);color:var(--acc)}
header .sp{flex:1}
header .stat{color:var(--mute);font-size:13px}
header .stat b{color:var(--text);font-variant-numeric:tabular-nums}
#app{display:flex;height:calc(100% - 48px)}
#rail{width:190px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px 0;overflow:auto}
body.railoff #rail{display:none}
#rail .st{display:flex;gap:9px;align-items:center;padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
#rail .st:hover{background:var(--line2)}
#rail .st.cur{background:var(--acc-bg);border-left-color:var(--acc);font-weight:600}
#rail .num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--grey);display:grid;place-items:center;font-size:12px;color:var(--mute);flex:none}
#rail .st.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
#rail .st.running .num{border-color:var(--acc);color:var(--acc);animation:pulse 1.1s infinite}
#rail .st.blocked .num{background:var(--bad);border-color:var(--bad);color:#fff}
#rail .sub{display:block;font-size:11px;font-weight:400;color:var(--mute)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(36,88,198,.18)}}
#main{flex:1;overflow:auto;padding:18px 22px 60px;min-width:0}
h2{margin:0 0 4px;font-size:20px}
h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.lead{color:var(--mute);margin:0 0 14px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sp{flex:1}
button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:#1b47a4;color:#fff}
button.sm{padding:2px 8px;font-size:12px}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=url],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:12.5px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);background:#fafbfc;position:sticky;top:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--acc-bg)}
tr.sel td{background:var(--acc-bg)}
tr.grey td{color:var(--grey)}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll table{border:0}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;background:var(--line2);color:var(--mute);margin:1px 3px 1px 0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.acc{background:var(--acc-bg);color:var(--acc)}
.err{background:var(--bad-bg);border:1px solid #efbcbc;color:var(--bad);padding:8px 12px;border-radius:6px;margin:8px 0}
.note{background:var(--warn-bg);border:1px solid #f0d9a8;color:#6b4300;padding:8px 12px;border-radius:6px;margin:8px 0}
.info{color:var(--mute);font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.mute{color:var(--mute)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mute)}
.foot{display:flex;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc-bg);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.slot{display:grid;grid-template-columns:230px 1fr 150px;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.slot.miss{background:linear-gradient(90deg,var(--bad-bg),transparent 60%)}
.slot .lbl{font-weight:600} .slot .key{font-family:var(--mono);font-size:11px;color:var(--mute)}
.slot .src{font-size:12px;color:var(--mute);margin-top:3px;font-style:italic}
.slot input[type=text],.slot input:not([type]){width:100%}
.slot .acts{text-align:right}
.floor li{margin-bottom:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tc.rej{opacity:.65}.tc.rej .mv{text-decoration:line-through}
.tc .ex{font-style:italic;color:#38425a;margin-top:4px}
details>summary{cursor:pointer;color:var(--acc)}
.tx{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;max-height:420px;overflow:auto}
.tl{padding:3px 0}.tl .who{font-size:11px;text-transform:uppercase;color:var(--mute);margin-right:6px}
.tl.agent .who{color:var(--acc)}
/* calls */
#calls{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
#callList .ci{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:6px;cursor:pointer}
#callList .ci.sel{border-color:var(--acc);background:var(--acc-bg)}
#callList .ci .n{font-weight:600}
#cols{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(300px,1.35fr) minmax(250px,1fr);gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;height:calc(100vh - 290px);min-height:380px}
.col>h4{margin:0;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.col .body{padding:10px 12px;overflow:auto;flex:1;font-size:15px}
#colCall .body{font-size:17px;line-height:1.5}
#colMoves .body{font-size:15.5px}
.ln{padding:5px 0}.ln .who{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);display:block}
.ln.agent .who{color:var(--acc)}
.ln.customer{background:#f7f8fb;margin:2px -6px;padding:5px 6px;border-radius:6px}
.ln.system{font-size:13px;color:var(--mute);font-style:italic}
.tool{display:inline-block;font-size:13px;padding:2px 9px;border-radius:12px;margin:3px 0;font-family:var(--mono)}
.tool.ok{background:var(--ok-bg);color:var(--ok)}.tool.no{background:var(--bad-bg);color:var(--bad);font-weight:600}
.corr{background:var(--warn-bg);border-left:4px solid #e49a1a;color:#6b4300;padding:5px 10px;margin:5px 0;font-size:15px;border-radius:0 6px 6px 0}
.guardln{background:var(--bad);color:#fff;padding:6px 10px;margin:6px 0;font-weight:600;border-radius:5px;font-size:15px}
.mv{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:10px;background:#fcfcfd}
.mv .sit{font-size:13px;color:var(--mute);margin-bottom:6px}
.mv .said{font-style:italic;margin-bottom:8px}
.cand{margin:7px 0}
.cand .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cand .bar{height:12px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:3px}
.cand .bar i{display:block;height:100%;width:0;background:#aab6d4;border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cand.pick .t{font-weight:700;color:var(--acc)}
.cand.pick .bar i{background:var(--acc)}
.cand.pick{background:var(--acc-bg);margin:7px -6px;padding:4px 6px;border-radius:6px}
.mv .ms{font-size:12px;color:var(--mute);text-align:right}
.qr{width:150px;height:150px;border:1px solid var(--line);border-radius:6px;background:#fff}
.dlg{position:fixed;inset:0;background:rgba(20,26,40,.4);display:grid;place-items:center;z-index:9}
.dlg>div{background:#fff;padding:20px 24px;border-radius:10px;max-width:420px}
@media (min-width:1500px){#cols{grid-template-columns:1fr 1.5fr 1.1fr}}
</style>
</head>
<body>
<header>
  <span class="brand">Prova</span>
  <nav class="topnav"><a href="/ui/setup.html">Setup</a><a href="/ui/setup.html#radar">Radar</a><a href="/ui/mission.html">Mission</a><a href="/ui/playbook.html">Playbook</a><a href="/ui/lab.html">Lab</a><a href="/" class="cur">Inspect</a><a href="#" onclick="provaLoadDemo(event)" title="Load the finished demo run: every step usable, calls always allowed" style="font-weight:600">Load demo</a></nav>
  <span class="co" id="hCo"></span>
  <span id="hStatus"></span>
  <span id="hFake"></span>
  <span class="sp"></span>
  <span class="stat" id="hCost"></span>
  <button class="sm" data-act="toggleRail">Toggle steps</button>
  <span class="stat" id="hConn"></span>
</header>
<div id="app">
  <nav id="rail"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ============================================================ helpers */
const $ = (s, r) => (r || document).querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pj = v => { if (typeof v === "string") { try { return JSON.parse(v); } catch (e) { return v; } } return v; };
const arr = v => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
const eur = v => (v == null || isNaN(v)) ? "-" : Number(v).toFixed(Number(v) < 1 ? 3 : 2) + " EUR";
const short = (s, n) => { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const js = v => { try { return JSON.stringify(v, null, 1); } catch (e) { return String(v); } };
const chip = (t, cls) => `<span class="chip ${cls || ""}">${esc(t)}</span>`;
const spin = '<span class="spin"></span>';
const timers = {};
function later(k, fn, ms) { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms || 250); }

async function api(method, path, body, form) {
  try {
    const o = { method, headers: {} };
    if (body !== undefined) {
      if (form) o.body = body; else { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
    }
    const r = await fetch(path, o);
    const txt = await r.text();
    let d = null;
    try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = { raw: txt }; }
    let err = null;
    if (!r.ok) err = (d && (d.error || (d.detail && (typeof d.detail === "string" ? d.detail : js(d.detail))))) || (r.status + " " + r.statusText);
    else if (d && d.error && !d.started) err = typeof d.error === "string" ? d.error : js(d.error);
    return { ok: !err, status: r.status, data: d, error: err };
  } catch (e) { return { ok: false, status: 0, data: null, error: "Network error: " + e }; }
}
const get = p => api("GET", p);

/* ============================================================ state */
const STEPS = [
  { id: 1, key: "data", name: "Data" }, { id: 2, key: "company", name: "Company & goal" },
  { id: 3, key: "policy", name: "Policy" }, { id: 4, key: "playbook", name: "Playbook" },
  { id: 5, key: "safety", name: "Safety test" }, { id: 6, key: "plan", name: "Plan" },
  { id: 7, key: "calls", name: "Calls" }, { id: 8, key: "results", name: "Results" },
];
const S = {
  view: 1, status: {}, err: {}, pending: {}, bind: {}, edits: {},
  samples: [], ingest: null, customers: [], rejects: [], docs: [], policy: null, playbook: [], evalRun: null,
  evalRows: {}, clock: null, report: null, followups: [], handoffs: [], confirmations: [], callsList: [],
  rawCache: {}, openRaw: null, evalCall: null, sel: null, store: {}, lastId: 0, mode: "sim", follow: true,
  phoneChecked: 0,
};
function callStore(id) { return S.store[id] || (S.store[id] = { id, items: [], seen: new Set(), moves: [], warm: [], brief: null, ended: null, loaded: false, meta: null }); }
const custName = id => { const c = S.customers.find(x => x.id === id); return c ? c.name : (id != null ? "customer " + id : ""); };
const setupOf = () => pj(S.status.setup) || pj((S.status.company || {}).setup) || {};

function stepState(st) {
  const su = setupOf(); let v = su[st.key];
  if (st.key === "company") v = su.company || su.docs || (su.policy === "done" || su.policy === "running" ? su.policy : v);
  if (st.key === "calls") v = (S.status.live_calls || S.callsList.some(c => c.status && c.status !== "ended" && c.status !== "failed")) ? "running" : (S.callsList.some(c => c.mode === "live" || c.mode === "sim") ? "done" : v);
  if (st.key === "results") v = (S.report && S.report.calls && S.report.calls.total) ? "done" : v;
  if (S.pending[st.key] || (st.key === "company" && S.pending.policy)) return "running";
  return v || "todo";
}

/* ============================================================ rail, header */
function renderRail() {
  $("#rail").innerHTML = STEPS.map(st => {
    const s = stepState(st);
    return `<div class="st ${s} ${S.view === st.id ? "cur" : ""}" data-act="go" data-arg="${st.id}"><span class="num">${s === "done" ? "&#10003;" : s === "blocked" ? "!" : st.id}</span><span>${esc(st.name)}<span class="sub">${s}</span></span></div>`;
  }).join("");
}
function renderHeader() {
  const c = S.status.company || {};
  $("#hCo").textContent = c.name || "No company yet";
  const stt = c.status || "draft";
  $("#hStatus").innerHTML = chip(stt, stt === "live" ? "ok" : stt === "paused" ? "warn" : stt === "approved" ? "acc" : "");
  const fake = S.status.fake || S.status.FAKE || S.status.fake_mode || S.status.mode === "fake" || S.status.llm_fake;
  $("#hFake").innerHTML = fake ? chip("FAKE mode", "warn") : "";
  const running = runningCount();
  $("#hCost").innerHTML = `Cost <b>${eur(totalCost())}</b> &nbsp; Running <b>${running}</b>`;
}
function totalCost() { const s = S.status; const c = s.cost_total_eur != null ? s.cost_total_eur : (s.cost_total != null ? s.cost_total : s.cost); return c && typeof c === "object" ? c.total : c; }
function jobErrors() { return arr(S.status.jobs).filter(j => j.status === "error"); }
function runningCount() {
  const live = S.callsList.filter(c => (c.mode === "live" || c.mode === "sim") && c.status && !["ended", "failed"].includes(c.status)).length;
  const sl = Array.isArray(S.status.live_calls) ? S.status.live_calls.length : (typeof S.status.live_calls === "number" ? S.status.live_calls : 0);
  return Math.max(live, sl);
}

/* ============================================================ data loading */
async function loadStatus() {
  const r = await get("/api/status");
  if (r.ok && r.data) { S.status = r.data; if (!arr(r.data.jobs).some(j => j.status === "running")) for (const k in S.pending) if (Date.now() - S.pending[k] > 4000) delete S.pending[k]; } else if (r.error) S.status = Object.assign({}, S.status, { _err: r.error });
  renderRail(); renderHeader();
}
const L = {
  async samples() { const r = await get("/api/samples"); S.samples = r.ok ? arr(r.data.samples || r.data) : []; },
  async ingest() { const r = await get("/api/ingest"); S.ingest = r.ok ? r.data : null; },
  async customers() { const r = await get("/api/customers"); if (r.ok) S.customers = arr(r.data.customers || r.data); },
  async rejects() { const r = await get("/api/rejects"); if (r.ok) S.rejects = arr(r.data.rejects || r.data); },
  async docs() { const r = await get("/api/docs"); if (r.ok) S.docs = arr(r.data.docs || r.data); },
  async policy() { const r = await get("/api/policy"); if (r.ok) S.policy = r.data; else S.err[3] = r.error; },
  async playbook() { const r = await get("/api/playbook"); if (r.ok) S.playbook = arr(r.data.cards || r.data.playbook || r.data); },
  async eval() { const r = await get("/api/eval"); if (r.ok && r.data) { S.evalRun = r.data; const run = r.data.run || r.data; arr(r.data.results || run.results).forEach(x => { S.evalRows[x.attack_id || x.id] = Object.assign({}, S.evalRows[x.attack_id || x.id], x); }); } },
  async ready() { const r = await get("/api/ready?mode=live"); if (r.ok) S.ready = r.data; },
  async clock() { const r = await get("/api/clock"); if (r.ok) S.clock = r.data; },
  async calls() { const r = await get("/api/calls"); if (r.ok) S.callsList = arr(r.data.calls || r.data).filter(c => c.mode !== "warmup" && c.mode !== "eval"); },
  async report() { const r = await get("/api/report"); S.report = r.ok ? r.data : null; if (!r.ok) S.err[8] = r.error; },
  async followups() { const r = await get("/api/followups"); if (r.ok) S.followups = arr(r.data.followups || r.data); },
  async handoffs() { const r = await get("/api/handoffs"); if (r.ok) S.handoffs = arr(r.data.handoffs || r.data); },
  async confirmations() {
    const won = S.callsList.filter(c => c.outcome === "won").slice(0, 40);
    const out = await Promise.all(won.map(c => get("/api/calls/" + c.id)));
    S.confirmations = out.filter(r => r.ok && r.data && r.data.confirmation).map(r => Object.assign({ call_id: r.data.call ? r.data.call.id : (r.data.id) }, r.data.confirmation));
  },
};
const STEP_LOADS = {
  1: ["samples", "ingest", "customers", "rejects"], 2: ["docs", "samples"], 3: ["policy"], 4: ["playbook"], 5: ["eval", "policy"],
  6: ["customers", "clock"], 7: ["customers", "calls", "samples", "ready"], 8: ["calls", "report", "followups", "handoffs", "playbook"],
};
async function loadStep(n, rerender) {
  await Promise.all((STEP_LOADS[n] || []).map(k => L[k]().catch(() => {})));
  if (n === 8) await L.confirmations().catch(() => {});
  if (rerender !== false && S.view === n) renderStep();
}

/* ============================================================ view switching */
function go(n) {
  S.view = n; S.err[n] = S.err[n] || null; renderRail(); $("#main").innerHTML = '<p class="info">' + spin + "Loading</p>";
  loadStep(n).then(() => { if (n === 7) onEnter7(); });
  try { location.hash = "s" + n; } catch (e) {}
}
function renderStep() {
  const f = [null, step1, step2, step3, step4, step5, step6, step7, step8][S.view];
  const m = $("#main"); const keep = m.scrollTop;
  try { m.innerHTML = f(); } catch (e) { m.innerHTML = `<div class="err">Rendering this step failed: ${esc(e)}</div>`; }
  m.scrollTop = keep;
  if (S.view === 7) afterRender7();
  renderRail();
}
const errBox = n => (S.err[n] ? `<div class="err">${esc(S.err[n])}</div>` : "") + jobErrors().slice(-2).map(j => `<div class="err">Background job ${esc(j.kind)} failed: ${esc(j.error)}</div>`).join("");
const bind = (name, def) => S.bind[name] != null ? S.bind[name] : (def == null ? "" : def);
function nav(n, canNext) {
  return `<div class="foot">${n > 1 ? `<button data-act="go" data-arg="${n - 1}">Back</button>` : ""}<span class="sp"></span>${n < 8 ? `<button class="${canNext ? "pri" : ""}" data-act="go" data-arg="${n + 1}">Continue</button>` : ""}</div>`;
}
const running = key => !!S.pending[key] || setupOf()[key] === "running";

/* generic: start a background action */
async function start(stepNo, key, method, path, body, form) {
  S.err[stepNo] = null; S.pending[key] = Date.now();
  renderRail(); if (S.view === stepNo) renderStep();
  const r = await api(method, path, body, form);
  if (!r.ok) { delete S.pending[key]; S.err[stepNo] = r.error; }
  else if (!(r.data && r.data.started)) { delete S.pending[key]; await loadStatus(); await loadStep(stepNo, false); }
  renderRail(); if (S.view === stepNo) renderStep();
  return r;
}
setInterval(() => { // never leave a spinner forever

/* a started call/campaign can still be refused or fail in the background: show why instead of doing nothing */
async function watchJob(id) {
  if (!id) return;
  for (let i = 0; i < 400; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const r = await get("/api/jobs/" + id); if (!r.ok || !r.data) return;
    if (r.data.status === "running") continue;
    const res = [].concat(r.data.result || []);
    const bad = res.filter(x => x && (x.denied || x.error || x.outcome === "failed"));
    const msg = r.data.error || bad.map(x => x.reason || x.error || (x.outcome_detail && x.outcome_detail.note) || "call failed").filter(Boolean).join(" | ");
    if (msg) { S.err[7] = msg; if (S.view === 7) softRefresh(true); }
    refreshCalls(); return;
  }
}
/* safety net for sync: whenever anything the server reports changes, reload the step on screen */
let lastSig = "";
function statusSig() { const s = S.status || {}, c = s.company || {}, ph = s.phone || {}; return js([s.setup, c.status, c.policy_version, c.name, s.counts, s.missing_required, arr(s.jobs).map(j => j.id + j.status), ph.browser_phones, ph.phone_url, ph.tunnel, String(s.clock || '').slice(0, 13)]); }
function softRefresh(force) {
  const a = document.activeElement, m = $("#main");
  if (a && m && m.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== "radio" && a.type !== "checkbox" && a.type !== "file") return false; // do not wipe what is being typed
  if (S.view === 7) { Promise.all([L.customers(), L.calls(), L.ready()]).then(() => { renderStep(); }); }
  else loadStep(S.view);
  return true;
}
setInterval(async () => {
  if (document.visibilityState !== "visible") return;
  await loadStatus(); const sig = statusSig();
  if (sig !== lastSig && softRefresh()) lastSig = sig;
}, 2000);

/* ============================================================ live events */
function handleEvent(ev) {
  if (!ev || ev.id == null) { if (!ev || !ev.type) return; }
  if (ev.id != null) { if (ev.id <= S.lastId) return; S.lastId = ev.id; }
  const p = pj(ev.payload) || {};
  ingestEvent(ev, false);
  switch (ev.type) {
    case "setup": {
      const key = p.step; const done = p.status && p.status !== "running";
      if (key && done) delete S.pending[key];
      if (key === "policy" && done) delete S.pending.company;
      later("status", loadStatus, 150);
      const view = { data: 1, policy: [2, 3], playbook: 4, safety: 5, plan: 6 }[key];
      if (view && [].concat(view).includes(S.view)) { if (done || S.view === 5) later("step" + S.view, () => loadStep(S.view), 300); else renderRail(); }
      else if (view) later("rail", renderRail, 100);
      if (key === "data" && done) { S.rawCache = {}; }
      break; }
    case "policy": if (S.view === 3) later("pol", () => loadStep(3), 400); break;
    case "card": if (S.view === 4 || S.view === 8) later("card", () => loadStep(S.view), 500); break;
    case "eval": {
      if (p.attack_id) {
        const r = S.evalRows[p.attack_id] = Object.assign({ attack_id: p.attack_id }, S.evalRows[p.attack_id], { passed: p.passed });
        later("evalfetch", async () => { await L.eval(); if (S.view === 5) renderStep(); }, 500);
        if (S.view === 5) later("evalr", renderStep, 120);
      } else { delete S.pending.safety; later("evalfetch", async () => { await L.eval(); await loadStatus(); if (S.view === 5) renderStep(); }, 300); }
      break; }
    case "cost": later("status", loadStatus, 600); if (S.view === 7) later("kpi", renderKpis, 700); break;
    case "confirmation": case "handoff": case "followup": case "review":
      if (S.view === 8) later("res", () => loadStep(8), 700); break;
    case "dial_check": break;
  }
}
let es = null, pollTimer = null, esFails = 0;
function conn(s) { $("#hConn").textContent = s; }
function startStream() {
  try {
    es = new EventSource("/api/events/stream");
    es.onopen = () => { esFails = 0; stopPoll(); conn("live"); };
    const onEv = m => { try { handleEvent(JSON.parse(m.data)); } catch (e) { console.warn("bad event", e); } };
    es.onmessage = onEv;
    es.addEventListener("event", onEv); // the server names its events "event"; onmessage alone never fires for those
    es.onerror = () => { esFails++; conn("reconnecting"); if (esFails >= 2) { try { es.close(); } catch (e) {} startPoll(); } };
  } catch (e) { startPoll(); }
}
function startPoll() {
  if (pollTimer) return; conn("polling");
  pollTimer = setInterval(async () => {
    const r = await get("/api/events?after=" + S.lastId); if (!r.ok) return;
    arr(r.data.events || r.data).forEach(handleEvent);
  }, 1000);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

window.addEventListener("hashchange", () => { const h = parseInt((location.hash || "").replace("#s", ""), 10); if (h >= 1 && h <= 8 && h !== S.view) go(h); });
/* ============================================================ boot */
(async function boot() {
  const h = parseInt((location.hash || "").replace("#s", ""), 10);
  await loadStatus();
  const su = setupOf();
  let first = 1; if (h >= 1 && h <= 8) first = h; else { for (const st of STEPS.slice(0, 6)) { if (su[st.key] !== "done") { first = st.id; break; } first = 7; } }
  go(first);
  startStream();
  setInterval(() => { if (document.visibilityState === "visible") loadStatus(); }, 8000);
})();
