[project]
name = "prova"
version = "0.1.0"
description = "Prova: a call desk that onboards itself, rehearses before it calls, and learns from every call"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "google-genai",
    "numpy",
    "mcp<2",
    "segno>=1.6.6",
    "openpyxl",
    "pypdf",
    "python-multipart",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
